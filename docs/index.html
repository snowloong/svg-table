<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Table 文档</title>
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/buble.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      window.$docsify = {
        name: "SVG Table",
        repo: "https://github.com/snowloong/svg-table",
        loadSidebar: true,
        loadNavbar: true,
        mergeNavbar: true,
        alias: {
          "/zh/_sidebar.md": "/zh/_sidebar.md",
          "/en/_sidebar.md": "/en/_sidebar.md",
          "/zh/.*/_sidebar.md": "/zh/_sidebar.md",
          "/en/.*/_sidebar.md": "/en/_sidebar.md",
          "/zh/_navbar.md": "/zh/_navbar.md",
          "/en/_navbar.md": "/en/_navbar.md",
          "/zh/.*/_navbar.md": "/zh/_navbar.md",
          "/en/.*/_navbar.md": "/en/_navbar.md",
          "/zh/": "/zh/README.md",
          "/en/": "/en/README.md",
          "/": "/zh/README.md",
        },
        plugins: [
          function (hook, vm) {
            hook.beforeEach(function (html) {
              return (
                '<div style="text-align:right;">' +
                '<a href="/zh/">中文</a> | <a href="/en/">English</a>' +
                "</div>\n" +
                html
              );
            });
          },
        ],
      };
    </script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  </body>
</html>
